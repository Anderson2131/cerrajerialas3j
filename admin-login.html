<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Cerrajería Las 3J</title>
    <link rel="stylesheet" href="style.css?v=13">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo img {
            max-height: 60px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .login-logo h2 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
        }
        .login-logo p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 5px;
        }
        .login-form-group {
            margin-bottom: 20px;
        }
        .login-form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .login-form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }
        .login-form-group input:focus {
            outline: none;
            border-color: #F59E0B;
        }
        .login-form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #D97706, #F59E0B);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.4);
        }
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .login-logo h2 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <img src="img/logo.png" alt="Cerrajería Las 3J">
            <h2>CERRAJERÍA LAS 3J</h2>
            <p>Acceso Administrador - Sistema de Facturación</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="login-form-group">
                <label><i class="fas fa-phone"></i> Número de Teléfono</label>
                <input type="tel" id="phone" placeholder="Ingrese su número" required autocomplete="tel" maxlength="15">
            </div>
            <div class="login-form-group">
                <label><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-shield-alt"></i> Ingresar
            </button>
        </form>

        <div class="login-footer">
            <p>Sistema protegido con autenticación de administrador</p>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DEL ADMINISTRADOR
        const ADMIN_CONFIG = {
            phone: "3249610909",      // Número de teléfono autorizado
            password: "213117"        // Contraseña del administrador
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Validar credenciales
            if (phone === ADMIN_CONFIG.phone && password === ADMIN_CONFIG.password) {
                // Guardar sesión en localStorage
                localStorage.setItem('admin_authenticated', 'true');
                localStorage.setItem('admin_login_time', Date.now());
                
                // Redirigir a Factura.html
                window.location.href = 'Factura.html';
            } else {
                // Mostrar error
                errorMessage.textContent = 'Credenciales incorrectas. Intente nuevamente.';
                errorMessage.style.display = 'block';
                
                // Limpiar campos
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
