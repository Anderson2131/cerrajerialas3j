<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema de Facturación - Cerrajería Las 3J</title>
    <link rel="stylesheet" href="style.css?v=13">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .access-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .access-container h2 { color: #fff; font-size: 26px; margin-bottom: 10px; }
        .access-container p { color: rgba(255, 255, 255, 0.6); font-size: 15px; margin-bottom: 30px; }
        .access-icon {
            font-size: 60px;
            color: #F59E0B;
            margin-bottom: 20px;
        }
        .btn-access {
            display: inline-block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #D97706, #F59E0B);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-access:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.4);
        }
        .access-info {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #FCD34D;
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 20px;
        }
        .access-footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="access-container">
        <div class="access-icon">
            <i class="fas fa-file-invoice-dollar"></i>
        </div>
        <h2>Sistema de Facturación</h2>
        <p>Cerrajería Las 3J - Genera y descarga tus facturas en PDF</p>

        <a href="login.html" class="btn-access">
            <i class="fas fa-shield-alt"></i> Ingresar al Sistema
        </a>

        <div class="access-info">
            <i class="fas fa-lock"></i> Sistema protegido con autenticación TOTP<br>
            Se requiere número de teléfono autorizado y código de 6 dígitos
        </div>

        <div class="access-footer">
            <p>&copy; 2026 Cerrajería Las 3J - Todos los derechos reservados</p>
        </div>
    </div>
</body>
</html>
